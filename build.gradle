/*
 * GravityEngine aggregate build.
 *
 * Responsibilities:
 * - repository-level identity for the aggregate/common build
 * - orchestrate independent loader/version targets
 *
 * Loader-specific configuration must remain inside targets/.
 */

group = providers.gradleProperty('mod_group_id').get()
version = providers.gradleProperty('mod_version').get()

def targetBuilds = [
        'forge-1.20.1': [
                directory: 'targets/forge-1.20.1',
                task     : 'buildForge1201'
        ],
        'fabric-1.20.1': [
                directory: 'targets/fabric-1.20.1',
                task     : 'buildFabric1201'
        ],
        'neoforge-1.21.1': [
                directory: 'targets/neoforge-1.21.1',
                task     : 'buildNeoForge1211'
        ]
]

def selectedTarget =
        providers.gradleProperty('target').orNull

def buildAllTargets =
        providers.gradleProperty('allTargets')
                .map { it.toBoolean() }
                .orElse(false)

if (selectedTarget != null
        && !targetBuilds.containsKey(selectedTarget)) {

    throw new GradleException(
            "Unknown target '${selectedTarget}'. " +
                    "Available targets: " +
                    targetBuilds.keySet().join(', ')
    )
}

/*
 * common belongs to this aggregate build when invoked from repository root.
 *
 * Individual targets include the exact same ../../common directory in their
 * own Gradle build, so common must remain self-contained.
 */
project(':common') {
    group = rootProject.group
    version = rootProject.version
}

targetBuilds.each { targetName, targetBuild ->
    tasks.register(targetBuild.task, Exec) {
        group = 'build'

        description =
                "Builds ${targetName} in its independent Gradle project."

        workingDir file(targetBuild.directory)

        /*
         * Keep target builds isolated from the aggregate Gradle model.
         *
         * Each target owns its loader plugin, Minecraft version and Java
         * toolchain.
         */
        commandLine(
                'cmd',
                '/c',
                'gradlew.bat',
                'build',
                '--console',
                'plain',
                '--no-daemon'
        )
    }
}

tasks.register('build') {
    group = 'build'

    description =
            'Builds common and optionally one or all platform targets.'

    dependsOn ':common:build'

    if (selectedTarget != null) {
        dependsOn tasks.named(
                targetBuilds[selectedTarget].task
        )
    }

    if (buildAllTargets.get()) {
        targetBuilds.values().each { targetBuild ->
            dependsOn tasks.named(targetBuild.task)
        }
    }
}