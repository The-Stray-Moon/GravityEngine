name: Verify Engine Changes

on:
  push:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/**'
      - 'verification/**'
      - 'gradlew*'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  pull_request:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'scripts/**'
      - 'verification/**'
      - 'gradlew*'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-common-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-targets:
    name: Discover Enabled Targets
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build target matrix
        id: discover
        shell: pwsh
        run: |
          $matrix = .\scripts\discover-targets.ps1
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  common-build:
    name: Common Compilation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile common (live acceptance runs separately through AutoJS)
        shell: pwsh
        run: .\gradlew.bat -p common clean assemble --console plain --no-daemon

  target-builds:
    name: ${{ matrix.target }} (JDK ${{ matrix.java }}, ${{ matrix.status }})
    needs: [discover-targets, common-build]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build target
        shell: pwsh
        run: .\scripts\build-target.ps1 -Target ${{ matrix.target }} -Attempts ${{ matrix.attempts }}
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-jdk-${{ matrix.java }}
          path: targets/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
